# Cenário científico: base física e de protocolo, os dois cenários da
# campanha (uma e duas vítimas) e o contraste pareado principal.
# Os valores globais ficam em [General], no omnetpp.ini.

[Config ProfessorScenarioCommon]
abstract = true
# Protocolo final: cada combinação usa 30 seeds e 900 s simulados.
repeat = 30
sim-time-limit = 900s
*.numDrones = 4
**.drone[0].app[0].droneId = "drone0"
**.drone[1].app[0].droneId = "drone1"
**.drone[2].app[0].droneId = "drone2"
**.drone[3].app[0].droneId = "drone3"

*.physicalEnvironment.spaceMaxX = 1000m
*.physicalEnvironment.spaceMaxY = 1000m
*.physicalEnvironment.config = xmldoc("professor-scenario-obstacles.xml")
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# DJI Phantom 4 Pro V2.0: ensaio a 13 m/s; subida/descida em modo P a
# 5/3 m/s. O teto de 20 m é requisito experimental, não limite do produto.
**.drone[*].mobility.alpha = 0.75
**.drone[*].mobility.speed = 13mps
**.drone[*].mobility.speedStdDev = 2mps
**.drone[*].mobility.angleStdDev = 15deg
**.drone[*].mobility.elevation = 0deg
**.drone[*].mobility.elevationStdDev = 5deg
**.drone[*].mobility.margin = 20m
**.drone[*].mobility.constraintAreaMaxX = 1000m
**.drone[*].mobility.constraintAreaMaxY = 1000m
**.drone[*].mobility.initialZ = 12m
**.drone[0].mobility.initialX = 150m
**.drone[0].mobility.initialY = 150m
**.drone[1].mobility.initialX = 850m
**.drone[1].mobility.initialY = 150m
**.drone[2].mobility.initialX = 150m
**.drone[2].mobility.initialY = 850m
**.drone[3].mobility.initialX = 850m
**.drone[3].mobility.initialY = 850m

# A professora chamou de Random Walk; por orientação posterior, a equipe
# usa a implementação RandomWaypointMobility disponível no INET 4.5.4.
**.team[*].mobility.typename = "RandomWaypointMobility"
**.team[*].mobility.constraintAreaMinX = 50m
**.team[*].mobility.constraintAreaMaxX = 950m
**.team[*].mobility.constraintAreaMinY = 50m
**.team[*].mobility.constraintAreaMaxY = 950m
**.team[*].mobility.constraintAreaMinZ = 0m
**.team[*].mobility.constraintAreaMaxZ = 0m
**.team[*].mobility.speed = uniform(1mps, 2mps)
**.team[*].mobility.waitTime = uniform(0s, 5s)
**.team[*].app[0].teamUpdateInterval = 1s
**.team[*].app[0].initialJitter = 1s
**.team[0].mobility.initialX = 200m
**.team[0].mobility.initialY = 850m
**.team[1].mobility.initialX = 100m
**.team[1].mobility.initialY = 100m
**.team[2].mobility.initialX = 500m
**.team[2].mobility.initialY = 100m
**.team[3].mobility.initialX = 900m
**.team[3].mobility.initialY = 100m
**.team[4].mobility.initialX = 100m
**.team[4].mobility.initialY = 300m
**.team[5].mobility.initialX = 500m
**.team[5].mobility.initialY = 300m
**.team[6].mobility.initialX = 900m
**.team[6].mobility.initialY = 300m
**.team[7].mobility.initialX = 100m
**.team[7].mobility.initialY = 500m
**.team[8].mobility.initialX = 900m
**.team[8].mobility.initialY = 500m
**.team[9].mobility.initialX = 100m
**.team[9].mobility.initialY = 700m
**.team[10].mobility.initialX = 500m
**.team[10].mobility.initialY = 700m
**.team[11].mobility.initialX = 900m
**.team[11].mobility.initialY = 700m
**.team[12].mobility.initialX = 100m
**.team[12].mobility.initialY = 900m
**.team[13].mobility.initialX = 500m
**.team[13].mobility.initialY = 900m
**.team[14].mobility.initialX = 900m
**.team[14].mobility.initialY = 900m

# Permite que alertas e ACKs atravessem drones intermediarios via AODV.
# O valor pertence ao cenario comum: entre os bracos pareados muda apenas baEnabled.
**.app[0].applicationIpTtl = 32
**.drone[*].app[0].victimAlertPayloadBytes = 320
**.drone[0].app[0].droneStatusInitialOffset = 0.2s
**.drone[1].app[0].droneStatusInitialOffset = 0.4s
**.drone[2].app[0].droneStatusInitialOffset = 0.6s
**.drone[3].app[0].droneStatusInitialOffset = 0.8s
**.team[*].app[0].teamUpdatePayloadBytes = 160
**.drone[*].app[0].retryInterval = 3s
**.drone[*].app[0].maxAttempts = 4
**.drone[*].app[0].repositionAfterUnackedAttempts = 2
**.drone[*].app[0].alertTtl = 25s
**.drone[*].app[0].alertInterval = 30s
**.drone[*].app[0].teamEntryLifetime = 30s

# BA busca uma posição segura no máximo uma vez por alerta.
**.drone[*].app[0].maximumRepositionDistance = 120m
**.drone[*].app[0].areaMaxX = 1000m
**.drone[*].app[0].areaMaxY = 1000m
**.drone[*].app[0].flightTimeLimit = 900s
**.drone[*].app[0].obstacleSigma = 20m
**.drone[*].app[0].obstacleSafetyMargin = 2m
**.drone[*].app[0].linkNormalizationDistance = 1000m
**.drone[*].app[0].batPopulation = 20
**.drone[*].app[0].batIterations = 50
**.drone[*].app[0].batInitializationAttempts = 100

**.ipv4.**.crcMode = "computed"
**.udp.crcMode = "disabled"
**.fcsMode = "computed"

[Config ProfessorBaOff]
extends = ProfessorScenarioCommon
abstract = true
**.drone[*].app[0].baEnabled = false

# Base sem variável iterativa: pode ser reutilizada pelo experimento principal
# sem criar combinações invisíveis de numTeams.
[Config Scenario1OneVictimBase]
extends = ProfessorBaOff
abstract = true
*.numVictims = 1
**.victim[0].victimId = "victim0"
**.victim[0].positionX = 100m
**.victim[0].positionY = 900m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 160s
**.victim[0].assignedDroneIndex = 2

# Robustez do cenário 1A: varia somente aqui a quantidade de equipes.
[Config Scenario1_OneVictim_BaOff]
extends = Scenario1OneVictimBase
description = "Scenario 1A control: one victim, direct link, BA off"
*.numTeams = ${teams=1,5,10,15}

[Config Scenario1_OneVictim_BaOn]
extends = Scenario1_OneVictim_BaOff
description = "Scenario 1A treatment: one victim, direct link, BA on"
# Declarado aqui, e não por herança múltipla de ProfessorBaOn: a cadeia da base
# BaOff alcança ProfessorBaOff primeiro e o tratamento seria descartado.
**.drone[*].app[0].baEnabled = true

# Referência preliminar sem obstáculos. A diretriz (25.3) prevê executá-la
# separadamente para calibrar a potência operacional antes das 30 repetições.
# Não é braço do experimento: usa BA desligado, uma equipe (o caso mais
# desfavorável para conectividade) e nenhum objeto no ambiente físico.
[Config Calibration_NoObstacles]
extends = Scenario1OneVictimBase
description = "Preliminary reference: no obstacles, BA off, operational power check"
*.numTeams = 1
*.physicalEnvironment.config = xml("<config/>")
*.radioMedium.obstacleLoss.typename = ""

# Validação preliminar de exposição do mecanismo. Roda só o braço tratado, com
# obstáculos, e responde a uma pergunta binária: o funil gatilho -> obstáculo ->
# BA -> movimento é alcançável, ou os casos observados foram acaso de seed?
# Não compara braços e não deve alimentar nenhuma conclusão sobre efeito.
# As seeds são deslocadas em 100 para não coincidir com as da campanha.
[Config Calibration_Exposure]
extends = Scenario1OneVictimBase
description = "Preliminary exposure funnel: obstacles, BA on, reserved seeds"
*.numTeams = 1
**.drone[*].app[0].baEnabled = true
seed-set = ${repetition} + 100

# Cenário 1B: 4 drones, 2 vítimas, 2 obstáculos e 1/5/10/15 equipes.
# Índices distintos garantem os dois drones solicitantes exigidos pelo PDF.
[Config Scenario1_TwoVictims_BaOff]
extends = ProfessorBaOff
description = "Scenario 1B control: two victims, direct link, BA off"
*.numTeams = ${teams=1,5,10,15}
*.numVictims = 2
**.victim[0].victimId = "victim0"
**.victim[0].positionX = 100m
**.victim[0].positionY = 900m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 160s
**.victim[0].assignedDroneIndex = 2
**.victim[1].victimId = "victim1"
**.victim[1].positionX = 900m
**.victim[1].positionY = 300m
**.victim[1].positionZ = 0m
**.victim[1].detectionTime = 260s
**.victim[1].assignedDroneIndex = 1

[Config Scenario1_TwoVictims_BaOn]
extends = Scenario1_TwoVictims_BaOff
description = "Scenario 1B treatment: two victims, direct link, BA on"
**.drone[*].app[0].baEnabled = true

# Experimento confirmatório mínimo: uma vítima, comunicação direta e uma
# quantidade fixa de equipes. Todos os parâmetros comuns são herdados do cenário
# físico; entre os dois braços muda exclusivamente baEnabled.
[Config MainExperimentBase]
extends = Scenario1OneVictimBase
abstract = true
repeat = 30
sim-time-limit = 900s
# Uma equipe elimina a seleção de destino como fator de confusão. A variação da
# quantidade de equipes pertence exclusivamente ao experimento de robustez.
*.numTeams = 1

[Config MainExperiment_BaOff]
extends = MainExperimentBase
description = "Primary paired control: direct communication, BA disabled"

[Config MainExperiment_BaOn]
extends = MainExperimentBase
description = "Primary paired treatment: direct communication, BA enabled"
**.drone[*].app[0].baEnabled = true
