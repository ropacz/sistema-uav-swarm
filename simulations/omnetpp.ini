[General]
seed-set = ${repetition}

# ── Fluxos aleatórios ────────────────────────────────────────────────────────
# O RNG global 0 é consumido por mobilidade, backoff do 802.11, AODV e jitter
# das aplicações. O Bat Algorithm sorteia milhares de valores por ativação, e
# esse consumo só ocorre no braço proposto: mantido no RNG 0, ele dessincroniza
# mobilidade e rede entre controle e proposta por um motivo que não é o
# tratamento. O RNG 1 isola o otimizador e preserva o pareamento por seed.
# A divergência causada fisicamente pelo drone se mover permanece — ela é o
# efeito do tratamento e deve ser observada.
num-rngs = 2
**.drone[*].app[0].rng-0 = 1

output-scalar-file = results/omnetpp/${configname}-${runnumber}.sca
output-vector-file = results/omnetpp/${configname}-${runnumber}.vec
# Regras específicas de vetores devem preceder a desativação global.
**.app[0].deliveryDelay.vector-recording = true
**.vector-recording = false
**.scalar-recording = true

**.mobility.initFromDisplayString = false

**.app[0].cmdenv-log-level = INFO

# Margem exclusivamente visual: projeta os 1000 m em 900 px e deixa 50 px
# livres em cada borda. Não altera coordenadas, mobilidade ou propagação.
*.visualizer.sceneVisualizer.viewScale = "0.9 0.9"
*.visualizer.sceneVisualizer.viewTranslation = "50 50"

# ── Endereçamento e roteamento ───────────────────────────────────────────────
# AODV gerencia as rotas dinamicamente, sob demanda.
# Rotas estáticas, de sub-rede e padrão permanecem desativadas — o AODV
# as descobre sob demanda. Todos os nós usam uma única sub-rede /24 para
# que o RREQ alcance vizinhos em modo ad hoc multissaltos.
*.configurator.config = xml("<config><interface hosts='*' address='10.0.0.x' netmask='255.255.255.0'/></config>")
*.configurator.addStaticRoutes  = false
*.configurator.addSubnetRoutes  = false
*.configurator.addDefaultRoutes = false
**.ip.limitedBroadcast = true
# forwarding=true vem do AdhocHost (base do AodvRouter) — habilita repasse IP multi-hop

# ── AODV ─────────────────────────────────────────────────────────────────────
# activeRouteTimeout=5 s: em FANET com mobilidade alta, rotas envelhecem rápido.
# Equilibra overhead de redescoberta com validade da rota.
**.aodv.activeRouteTimeout = 5s

# ── Meio físico sem fio ───────────────────────────────────────────────────────
**.radioMedium.typename                         = "Ieee80211ScalarRadioMedium"
**.radioMedium.pathLoss.typename                = "FreeSpacePathLoss"
**.radioMedium.backgroundNoise.typename         = "IsotropicScalarBackgroundNoise"
**.radioMedium.backgroundNoise.power            = -100dBm

**.wlan[*].radio.typename                       = "Ieee80211ScalarRadio"
# Todos os nós usam IEEE 802.11 em modo ad hoc, 2,4 GHz.
# A comunicação multissaltos é realizada pelo AODV — não pelo IEEE 802.11s.
**.wlan[*].radio.carrierFrequency               = 2.4GHz
**.wlan[*].radio.bandwidth                      = 22MHz
**.wlan[*].radio.receiver.sensitivity           = -85dBm
**.wlan[*].radio.receiver.snirThreshold         = 4dB
# Potência é definida pela configuração experimental.

**.wlan[*].mac.typename                         = "Ieee80211Mac"
**.wlan[*].mgmt.typename                        = "Ieee80211MgmtAdhoc"
**.wlan[*].agent.typename                       = ""
# Buffer MAC: 50 pacotes — previne overflow sem jitter excessivo [SCI-2019]
**.wlan[*].mac.queue.packetCapacity             = 50

# ═══════════════════════════════════════════════════════════════════════════
# Dissertation scenarios — 1 km², explicit victims, AppACK and paired BA test
# ═══════════════════════════════════════════════════════════════════════════
[Config DissertationBase]
network = echosar.simulations.BasicNetwork
description = "ECHOSAR-Net dissertation base: explicit victim and network-oriented repositioning"
# Base comum aos dois braços do experimento. Não é executável: uma execução da
# base seria indistinguível do braço proposto e ficaria arquivada sob um nome
# neutro, quebrando a proveniência. Use Experiment_Control_BaOff ou
# Experiment_Proposed_BaOn.
abstract = true
sim-time-limit = 900s
repeat = 30
seed-set = ${repetition}
*.numDrones = 4
*.numTeams = 1
*.numVictims = 1

*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = 0m
*.physicalEnvironment.spaceMaxX = 1000m
*.physicalEnvironment.spaceMaxY = 1000m
*.physicalEnvironment.spaceMaxZ = 25m
*.physicalEnvironment.config = xmldoc("dissertation-obstacles.xml")
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# Ieee80211Interface propaga opMode ao MAC e ao rádio; bitrate seleciona o
# modo DSSS. No INET 4.5.4, esse modo requer canal de 22 MHz.
**.wlan[*].opMode = "b"
**.wlan[*].bitrate = 1Mbps
**.wlan[*].radio.bandName = "2.4 GHz"
**.drone[*].wlan[*].radio.transmitter.power = 20mW
**.team[*].wlan[*].radio.transmitter.power = 20mW

**.drone[*].mobility.typename = "echosar.mobility.BaGaussMarkovMobility"
**.drone[*].mobility.alpha = 0.75
**.drone[*].mobility.speed = 13mps
**.drone[*].mobility.speedStdDev = 0mps
**.drone[*].mobility.angleStdDev = 20deg
**.drone[*].mobility.margin = 20m
**.drone[*].mobility.updateInterval = 1s
**.drone[*].mobility.constraintAreaMinX = 0m
**.drone[*].mobility.constraintAreaMaxX = 1000m
**.drone[*].mobility.constraintAreaMinY = 0m
**.drone[*].mobility.constraintAreaMaxY = 1000m
**.drone[*].mobility.constraintAreaMinZ = 10m
**.drone[*].mobility.constraintAreaMaxZ = 20m
**.drone[0].mobility.initialX = 500m
**.drone[0].mobility.initialY = 500m
**.drone[0].mobility.initialZ = 10m
**.drone[1].mobility.initialX = 510m
**.drone[1].mobility.initialY = 520m
**.drone[1].mobility.initialZ = 10m
**.drone[2].mobility.initialX = 480m
**.drone[2].mobility.initialY = 520m
**.drone[2].mobility.initialZ = 12m
**.drone[3].mobility.initialX = 500m
**.drone[3].mobility.initialY = 540m
**.drone[3].mobility.initialZ = 12m

# INET 4.5.4 has no module named RandomWalkMobility. MassMobility is the
# closest native bounded random-walk model and is therefore used explicitly.
**.team[*].mobility.typename = "MassMobility"
**.team[*].mobility.changeInterval = 5s
**.team[*].mobility.angleDelta = normal(0deg, 30deg)
**.team[*].mobility.speed = 1.5mps
**.team[*].mobility.constraintAreaMinX = 0m
**.team[*].mobility.constraintAreaMaxX = 1000m
**.team[*].mobility.constraintAreaMinY = 0m
**.team[*].mobility.constraintAreaMaxY = 1000m
# MassMobility cannot reflect inside a zero-thickness Z interval. With zero
# elevation the team remains at 1.5 m; this small margin only avoids the
# boundary assertion and does not introduce vertical movement.
**.team[*].mobility.constraintAreaMinZ = 1.4m
**.team[*].mobility.constraintAreaMaxZ = 1.6m
**.team[0].mobility.initialX = 540m
**.team[0].mobility.initialY = 500m
**.team[0].mobility.initialZ = 1.5m
**.team[0].app[0].teamId = "team0"
**.team[*].app[0].positionUpdateInterval = 1s

**.victim[0].victimId = "victim0"
**.victim[0].positionX = 500m
**.victim[0].positionY = 500m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 2s
# victim[1] só é instanciada quando numVictims = 2 (Validation_TwoVictims).
# Mantida aqui para que o cenário determinístico herde a mesma geometria.
**.victim[1].victimId = "victim1"
**.victim[1].positionX = 520m
**.victim[1].positionY = 500m
**.victim[1].positionZ = 0m
**.victim[1].detectionTime = 4s

**.app[0].appPort = 5000
**.drone[*].app[0].victimAlertPayloadBytes = 320
**.team[*].app[0].positionUpdatePayloadBytes = 160
**.team[*].app[0].victimAckPayloadBytes = 96
**.drone[*].app[0].retryInterval = 30s
**.drone[*].app[0].ackTimeout = 5s
**.drone[*].app[0].maxAttempts = 5
**.drone[*].app[0].alertTtl = 180s
**.drone[*].app[0].linkWindow = 10s
**.drone[*].app[0].teamSilenceTimeout = 3s
**.drone[*].app[0].maintenanceInterval = 0.1s
**.drone[*].app[0].pdrThreshold = 0.8
**.drone[*].app[0].rssiThreshold = -80dBm
**.drone[*].app[0].baEnabled = true
**.drone[*].app[0].maxBaCycles = 2
**.drone[*].app[0].maximumRepositionDistance = 25m
**.drone[*].app[0].minimumAltitude = 6m
**.drone[*].app[0].maximumAltitude = 20m
# Autonomia nominal de 30 min; a execução experimental dura somente 15 min.
**.drone[*].app[0].flightTimeLimit = 1800s
**.drone[*].app[0].applicationIpTtl = 32
**.team[*].app[0].applicationIpTtl = 32
**.drone[*].app[0].wLink = 0.60
**.drone[*].app[0].wObstacle = 0.25
**.drone[*].app[0].wMove = 0.15
**.drone[*].app[0].obstacleSigma = 10m
**.drone[*].app[0].obstacleSafetyMargin = 1m
**.drone[*].app[0].linkNormalizationDistance = 1000m
**.drone[*].app[0].batPopulation = 20
**.drone[*].app[0].batIterations = 50
**.drone[*].app[0].batInitializationAttempts = 100
**.drone[*].app[0].batFrequencyMin = 0
**.drone[*].app[0].batFrequencyMax = 2
**.drone[*].app[0].batInitialAmplitude = 0.9
**.drone[*].app[0].batInitialPulseRate = 0.5
**.drone[*].app[0].batAmplitudeDecay = 0.9
**.drone[*].app[0].batPulseGrowth = 0.9
**.drone[*].app[0].batLocalSearchScale = 0.1
**.drone[*].obstacleSensor.minimumRange = 0.7m
**.drone[*].obstacleSensor.maximumRange = 30m

# ═══════════════════════════════════════════════════════════════════════════
# Missão urbana — cenário do experimento científico
#
# O cenário original gerava um único alerta em t=2 s, confirmado na primeira
# tentativa. Como a avaliação de degradação só ocorre para alertas pendentes,
# o caminho degradação -> sensor -> reposicionamento nunca era exercitado: os
# dois braços produziam resultados idênticos por construção e a hipótese não
# era falseável. Medido em 30 pares: baActivations = 0 nas 60 execuções.
#
# Três mudanças, todas justificadas fisicamente e aplicadas igualmente aos
# dois braços:
#
#   1. Setor de busca de 200 m x 200 m em vez de 1 km x 1 km. Uma sortie de
#      busca cobre um setor delimitado pelo comando do incidente, não a área
#      inteira. Aproxima drones, equipe e edificações às distâncias em que o
#      sensor de obstáculo opera.
#   2. Quatro edificações de 30 x 30 x 10 m (urban-obstacles.xml) em vez de
#      dois blocos de 3 x 2 x 5 m. Um bloco daquele porte é um anteparo
#      pontual; a proposta trata de degradação ar-solo em terreno construído.
#   3. Dez vítimas detectadas ao longo da missão em vez de uma. Uma sortie de
#      busca acumula detecções ao longo do tempo, e a métrica primária passa a
#      ser uma proporção com variância interna em vez de uma variável de
#      Bernoulli.
#
# Nenhum parâmetro do Bat Algorithm, da função de aptidão ou do sensor foi
# alterado. Critério de aceitação do cenário e sua justificativa estão em
# docs/scientific_protocol.md secao 9.
# ═══════════════════════════════════════════════════════════════════════════

[Config UrbanMission]
extends = DissertationBase
description = "Urban search sector with buildings and victims detected over the mission"
abstract = true

*.numVictims = 10
# Dois UAVs: a redundância de relay precisa existir, para que o AODV continue
# no escopo, sem ser tão densa que qualquer obstrução ar-solo seja contornada
# por um vizinho. Com quatro UAVs num setor de 160 m nenhum alerta chegou a
# expirar em 10 execuções — a malha roteava em volta de toda obstrução e a
# métrica primária ficava presa no teto de 100 %.
*.numDrones = 2
*.physicalEnvironment.config = xmldoc("urban-obstacles.xml")

# Setor de busca. A área física do PhysicalEnvironment permanece de 1 km²;
# apenas a operação fica confinada ao setor.
**.drone[*].mobility.constraintAreaMinX = 420m
**.drone[*].mobility.constraintAreaMaxX = 580m
**.drone[*].mobility.constraintAreaMinY = 420m
**.drone[*].mobility.constraintAreaMaxY = 580m
# Faixa de voo logo acima do topo das edificações (10 m). Voo rasante entre
# quadras é a prática em busca urbana, e é essa geometria que faz a linha de
# visada ar-solo passar perto da fachada que a interrompe.
**.drone[*].mobility.constraintAreaMinZ = 12m
**.drone[*].mobility.constraintAreaMaxZ = 15m
**.drone[*].mobility.margin = 5m
**.drone[0].mobility.initialX = 480m
**.drone[0].mobility.initialY = 480m
**.drone[0].mobility.initialZ = 13m
**.drone[1].mobility.initialX = 520m
**.drone[1].mobility.initialY = 480m
**.drone[1].mobility.initialZ = 13m
**.drone[2].mobility.initialX = 480m
**.drone[2].mobility.initialY = 520m
**.drone[2].mobility.initialZ = 14m
**.drone[3].mobility.initialX = 520m
**.drone[3].mobility.initialY = 520m
**.drone[3].mobility.initialZ = 14m
# Candidatos do BA também respeitam o piso acima das edificações.
**.drone[*].app[0].minimumAltitude = 12m
**.drone[*].app[0].maximumAltitude = 15m
**.drone[*].app[0].areaMinX = 420m
**.drone[*].app[0].areaMaxX = 580m
**.drone[*].app[0].areaMinY = 420m
**.drone[*].app[0].areaMaxY = 580m

# A equipe percorre as ruas do setor no nível do solo.
**.team[*].mobility.constraintAreaMinX = 420m
**.team[*].mobility.constraintAreaMaxX = 580m
**.team[*].mobility.constraintAreaMinY = 420m
**.team[*].mobility.constraintAreaMaxY = 580m
**.team[0].mobility.initialX = 500m
**.team[0].mobility.initialY = 500m

# Vítimas distribuídas pelo setor, com detecções espaçadas em 70 s. A última
# detecção ocorre em 660 s, de modo que o TTL de 180 s de todo alerta se
# esgota dentro dos 900 s de simulação.
**.victim[*].positionZ = 0m
**.victim[0].victimId = "victim0"
**.victim[0].positionX = 440m
**.victim[0].positionY = 440m
**.victim[0].detectionTime = 30s
**.victim[1].victimId = "victim1"
**.victim[1].positionX = 470m
**.victim[1].positionY = 500m
**.victim[1].detectionTime = 100s
**.victim[2].victimId = "victim2"
**.victim[2].positionX = 500m
**.victim[2].positionY = 440m
**.victim[2].detectionTime = 170s
**.victim[3].victimId = "victim3"
**.victim[3].positionX = 560m
**.victim[3].positionY = 440m
**.victim[3].detectionTime = 240s
**.victim[4].victimId = "victim4"
**.victim[4].positionX = 440m
**.victim[4].positionY = 560m
**.victim[4].detectionTime = 310s
**.victim[5].victimId = "victim5"
**.victim[5].positionX = 500m
**.victim[5].positionY = 560m
**.victim[5].detectionTime = 380s
**.victim[6].victimId = "victim6"
**.victim[6].positionX = 560m
**.victim[6].positionY = 560m
**.victim[6].detectionTime = 450s
**.victim[7].victimId = "victim7"
**.victim[7].positionX = 500m
**.victim[7].positionY = 500m
**.victim[7].detectionTime = 520s
**.victim[8].victimId = "victim8"
**.victim[8].positionX = 440m
**.victim[8].positionY = 500m
**.victim[8].detectionTime = 590s
**.victim[9].victimId = "victim9"
**.victim[9].positionX = 560m
**.victim[9].positionY = 500m
**.victim[9].detectionTime = 660s

