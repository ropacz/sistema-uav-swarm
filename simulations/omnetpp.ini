[General]
seed-set = ${repetition}
num-rngs = 2
**.drone[*].app[0].rng-0 = 1
output-scalar-file = results/omnetpp/${configname}-${runnumber}.sca
output-vector-file = results/omnetpp/${configname}-${runnumber}.vec
**.app[0].deliveryDelay.vector-recording = true
**.vector-recording = false
**.scalar-recording = true
**.mobility.initFromDisplayString = false
**.app[0].cmdenv-log-level = INFO
*.visualizer.sceneVisualizer.viewScale = "0.9 0.9"
*.visualizer.sceneVisualizer.viewTranslation = "50 50"

# AODV descobre a rota direta entre os únicos dois nós de rádio do piloto.
*.configurator.config = xml("<config><interface hosts='*' address='10.0.0.x' netmask='255.255.255.0'/></config>")
*.configurator.addStaticRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.addDefaultRoutes = false
**.ip.limitedBroadcast = true
**.aodv.activeRouteTimeout = 5s

# 802.11b/DSSS, Friis em espaço livre e perda dielétrica independente.
**.radioMedium.typename = "Ieee80211ScalarRadioMedium"
**.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
**.radioMedium.pathLoss.alpha = 2
**.radioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"
**.radioMedium.backgroundNoise.power = -100dBm
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 2.4GHz
**.wlan[*].radio.bandwidth = 22MHz
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB
**.wlan[*].mac.typename = "Ieee80211Mac"
**.wlan[*].mgmt.typename = "Ieee80211MgmtAdhoc"
**.wlan[*].agent.typename = ""
**.wlan[*].mac.queue.packetCapacity = 50

# Base abstrata do único experimento. Os braços executáveis alteram somente
# baEnabled, preservando o pareamento causal por seed.
[Config HypothesisPilotBase]
network = echosar.simulations.BasicNetwork
description = "Natural obstacle-crossing pilot for the BA hypothesis"
abstract = true
repeat = 5
sim-time-limit = 120s
*.numDrones = 1
*.numTeams = 1
*.numVictims = 1

*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = 0m
*.physicalEnvironment.spaceMaxX = 1000m
*.physicalEnvironment.spaceMaxY = 1000m
*.physicalEnvironment.spaceMaxZ = 25m
*.physicalEnvironment.config = xmldoc("hypothesis-pilot-obstacle.xml")
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"
**.wlan[*].opMode = "b"
**.wlan[*].bitrate = 1Mbps
**.wlan[*].radio.bandName = "2.4 GHz"
**.wlan[*].radio.transmitter.power = 20mW

# O drone só muda de posição quando comandado pelo BA.
**.drone[0].mobility.typename = "echosar.mobility.BaGaussMarkovMobility"
**.drone[0].mobility.alpha = 0.75
**.drone[0].mobility.speed = 0mps
**.drone[0].mobility.speedStdDev = 0mps
**.drone[0].mobility.angleStdDev = 0deg
**.drone[0].mobility.margin = 20m
**.drone[0].mobility.updateInterval = 1s
**.drone[0].mobility.constraintAreaMinX = 0m
**.drone[0].mobility.constraintAreaMaxX = 1000m
**.drone[0].mobility.constraintAreaMinY = 0m
**.drone[0].mobility.constraintAreaMaxY = 1000m
**.drone[0].mobility.constraintAreaMinZ = 6m
**.drone[0].mobility.constraintAreaMaxZ = 20m
**.drone[0].mobility.initialX = 500m
**.drone[0].mobility.initialY = 500m
**.drone[0].mobility.initialZ = 6m

# A equipe começa visível, cruza o prédio a 1,5 m/s e para atrás dele.
**.team[0].mobility.typename = "TurtleMobility"
**.team[0].mobility.initialZ = 0m
**.team[0].mobility.turtleScript = xmldoc("hypothesis-pilot-team.xml")
**.team[0].app[0].teamId = "team0"
**.team[0].app[0].positionUpdateInterval = 0.1s

**.victim[0].victimId = "victim0"
**.victim[0].positionX = 500m
**.victim[0].positionY = 500m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 13s

**.app[0].appPort = 5000
**.drone[0].app[0].victimAlertPayloadBytes = 320
**.team[0].app[0].positionUpdatePayloadBytes = 160
**.team[0].app[0].victimAckPayloadBytes = 96
**.drone[0].app[0].retryInterval = 10s
**.drone[0].app[0].ackTimeout = 2s
**.drone[0].app[0].maxAttempts = 8
**.drone[0].app[0].alertTtl = 100s
**.drone[0].app[0].linkWindow = 10s
**.drone[0].app[0].teamSilenceTimeout = 3s
**.drone[0].app[0].teamPredictionHorizon = 15s
**.drone[0].app[0].maximumTeamPredictionSpeed = 5mps
**.drone[0].app[0].maintenanceInterval = 0.1s
**.drone[0].app[0].pdrThreshold = 0.8
**.drone[0].app[0].rssiThreshold = -80dBm

**.drone[0].app[0].maxBaCycles = 2
**.drone[0].app[0].maximumRepositionDistance = 40m
**.drone[0].app[0].minimumAltitude = 6m
**.drone[0].app[0].maximumAltitude = 20m
**.drone[0].app[0].areaMinX = 0m
**.drone[0].app[0].areaMaxX = 1000m
**.drone[0].app[0].areaMinY = 0m
**.drone[0].app[0].areaMaxY = 1000m
**.drone[0].app[0].horizontalSpeed = 13mps
**.drone[0].app[0].climbSpeed = 5mps
**.drone[0].app[0].descentSpeed = 3mps
**.drone[0].app[0].flightTimeLimit = 1800s
**.drone[0].app[0].applicationIpTtl = 32
**.team[0].app[0].applicationIpTtl = 32

# Função de aptidão e Bat Algorithm.
**.drone[0].app[0].wLink = 0.60
**.drone[0].app[0].wObstacle = 0.25
**.drone[0].app[0].wMove = 0.15
**.drone[0].app[0].obstacleSigma = 10m
**.drone[0].app[0].obstacleSafetyMargin = 1m
**.drone[0].app[0].linkNormalizationDistance = 1000m
**.drone[0].app[0].batPopulation = 20
**.drone[0].app[0].batIterations = 50
**.drone[0].app[0].batInitializationAttempts = 100
**.drone[0].app[0].batFrequencyMin = 0
**.drone[0].app[0].batFrequencyMax = 2
**.drone[0].app[0].batInitialAmplitude = 0.9
**.drone[0].app[0].batInitialPulseRate = 0.5
**.drone[0].app[0].batAmplitudeDecay = 0.9
**.drone[0].app[0].batPulseGrowth = 0.9
**.drone[0].app[0].batLocalSearchScale = 0.1
**.drone[0].obstacleSensor.minimumRange = 0.7m
**.drone[0].obstacleSensor.maximumRange = 30m

# PCAPNG opcional, ativado por ./run.sh --pcap.
*.drone[0].numPcapRecorders = 0
*.team[0].numPcapRecorders = 0
*.drone[0].pcapRecorder[*].fileFormat = "pcapng"
*.team[0].pcapRecorder[*].fileFormat = "pcapng"
*.drone[0].pcapRecorder[*].snaplen = 65535
*.team[0].pcapRecorder[*].snaplen = 65535
*.drone[0].pcapRecorder[*].dumpBadFrames = true
*.team[0].pcapRecorder[*].dumpBadFrames = true
*.drone[0].pcapRecorder[*].alwaysFlush = true
*.team[0].pcapRecorder[*].alwaysFlush = true
**.ipv4.**.crcMode = "computed"
**.udp.crcMode = "disabled"
**.fcsMode = "computed"

[Config HypothesisPilot_BaOff]
extends = HypothesisPilotBase
description = "Pilot control: natural obstruction with BA disabled"
**.drone[0].app[0].baEnabled = false

[Config HypothesisPilot_BaOn]
extends = HypothesisPilotBase
description = "Pilot treatment: natural obstruction with BA enabled"
**.drone[0].app[0].baEnabled = true
