[Config Validation_Direct]
extends = DissertationBase
description = "Deterministic direct delivery without obstacle"
repeat = 1
sim-time-limit = 20s
*.numDrones = 1
*.physicalEnvironment.config = xml("<config/>")
*.radioMedium.obstacleLoss.typename = ""
**.drone[0].mobility.speed = 0mps
**.team[0].mobility.typename = "StationaryMobility"

[Config Network_Log_Demo]
extends = Validation_Direct
description = "Short deterministic run with full per-host PCAPNG and OMNeT++ event logging"
repeat = 10
seed-set = ${repetition}
sim-time-limit = 5s

# Capture both transmitted and received IEEE 802.11 frames at every network host.
*.drone[*].numPcapRecorders = 1
*.team[*].numPcapRecorders = 1
*.drone[*].pcapRecorder[*].fileFormat = "pcapng"
*.team[*].pcapRecorder[*].fileFormat = "pcapng"
*.drone[*].pcapRecorder[*].snaplen = 65535
*.team[*].pcapRecorder[*].snaplen = 65535
*.drone[*].pcapRecorder[*].dumpBadFrames = true
*.team[*].pcapRecorder[*].dumpBadFrames = true
*.drone[*].pcapRecorder[*].alwaysFlush = true
*.team[*].pcapRecorder[*].alwaysFlush = true
*.drone[*].pcapRecorder[*].verbose = false
*.team[*].pcapRecorder[*].verbose = false

# PCAP serialization requires concrete IPv4/FCS values. UDP checksum remains
# disabled; the application payload itself uses the explicit ECHO wire format.
**.ipv4.**.crcMode = "computed"
**.udp.crcMode = "disabled"
**.fcsMode = "computed"

# Preserve the complete simulator event stream and all available result vectors.
record-eventlog = true
eventlog-file = results/eventlogs/${configname}-${runnumber}.elog
**.vector-recording = true

[Config Network_Realistic_Evaluation]
extends = DissertationBase
description = "Realistic multiseed network stress evaluation with mobility, obstacles, delayed team availability, AODV, BA and per-node PCAPNG"
repeat = 10
seed-set = ${repetition}
sim-time-limit = 120s

# Registra os cinco nós da configuração (quatro drones e uma equipe). Os
# escalares e vetores continuam sendo gravados pelo modelo; o eventlog fica
# desativado para evitar duplicar em grande volume o conteúdo auditável do PCAP.
*.drone[*].numPcapRecorders = 1
*.team[*].numPcapRecorders = 1
*.drone[*].pcapRecorder[*].fileFormat = "pcapng"
*.team[*].pcapRecorder[*].fileFormat = "pcapng"
*.drone[*].pcapRecorder[*].snaplen = 65535
*.team[*].pcapRecorder[*].snaplen = 65535
*.drone[*].pcapRecorder[*].dumpBadFrames = true
*.team[*].pcapRecorder[*].dumpBadFrames = true
*.drone[*].pcapRecorder[*].alwaysFlush = true
*.team[*].pcapRecorder[*].alwaysFlush = true
*.drone[*].pcapRecorder[*].verbose = false
*.team[*].pcapRecorder[*].verbose = false
**.ipv4.**.crcMode = "computed"
**.udp.crcMode = "disabled"
**.fcsMode = "computed"
record-eventlog = false
**.vector-recording = true

# Condição de estresse declarada: a equipe fica indisponível para confirmar
# alertas nos primeiros 30 s. Isso força timeout/retry e permite observar o
# caminho de degradação, sensor e BA sem alterar silenciosamente os pacotes.
**.team[0].app[0].ackStartTime = 30s
**.drone[*].app[0].rssiThreshold = -30dBm

