[General]
sim-time-limit = 300s
repeat = 10
seed-set = ${repetition}

output-scalar-file  = results/${configname}-${runnumber}.sca
# Regras específicas de vetores devem preceder a desativação global.
**.app[0].deliveryDelay.vector-recording = true
**.vector-recording = false
**.scalar-recording = true

**.mobility.initFromDisplayString = false

**.app[0].cmdenv-log-level = INFO

# Margem exclusivamente visual: projeta os 1000 m em 900 px e deixa 50 px
# livres em cada borda. Não altera coordenadas, mobilidade ou propagação.
*.visualizer.sceneVisualizer.viewScale = "0.9 0.9"
*.visualizer.sceneVisualizer.viewTranslation = "50 50"

# ── Endereçamento e roteamento ───────────────────────────────────────────────
# AODV gerencia as rotas dinamicamente, sob demanda.
# Rotas estáticas, de sub-rede e padrão permanecem desativadas — o AODV
# as descobre sob demanda. Todos os nós usam uma única sub-rede /24 para
# que o RREQ alcance vizinhos em modo ad hoc multissaltos.
*.configurator.config = xml("<config><interface hosts='*' address='10.0.0.x' netmask='255.255.255.0'/></config>")
*.configurator.addStaticRoutes  = false
*.configurator.addSubnetRoutes  = false
*.configurator.addDefaultRoutes = false
**.ip.limitedBroadcast = true
# forwarding=true vem do AdhocHost (base do AodvRouter) — habilita repasse IP multi-hop

# ── AODV ─────────────────────────────────────────────────────────────────────
# activeRouteTimeout=5 s: em FANET com mobilidade alta, rotas envelhecem rápido.
# Equilibra overhead de redescoberta com validade da rota.
**.aodv.activeRouteTimeout = 5s

# ── Meio físico sem fio ───────────────────────────────────────────────────────
**.radioMedium.typename                         = "Ieee80211ScalarRadioMedium"
**.radioMedium.pathLoss.typename                = "FreeSpacePathLoss"
**.radioMedium.backgroundNoise.typename         = "IsotropicScalarBackgroundNoise"
**.radioMedium.backgroundNoise.power            = -100dBm

**.wlan[*].radio.typename                       = "Ieee80211ScalarRadio"
# Todos os nós usam IEEE 802.11 em modo ad hoc, 2,4 GHz.
# A comunicação multissaltos é realizada pelo AODV — não pelo IEEE 802.11s.
**.wlan[*].radio.carrierFrequency               = 2.4GHz
**.wlan[*].radio.bandwidth                      = 20MHz
**.wlan[*].radio.receiver.sensitivity           = -85dBm
**.wlan[*].radio.receiver.snirThreshold         = 4dB
**.wlan[*].radio.transmitter.datarate           = 1Mbps
# Potência é definida pela configuração experimental.

**.wlan[*].mac.typename                         = "Ieee80211Mac"
**.wlan[*].mgmt.typename                        = "Ieee80211MgmtAdhoc"
**.wlan[*].agent.typename                       = ""
# Buffer MAC: 50 pacotes — previne overflow sem jitter excessivo [SCI-2019]
**.wlan[*].mac.queue.packetCapacity             = 50

# ═══════════════════════════════════════════════════════════════════════════
# Dissertation scenarios — 1 km², explicit victims, AppACK and paired BA test
# ═══════════════════════════════════════════════════════════════════════════
[Config DissertationBase]
network = echosar.simulations.BasicNetwork
description = "ECHOSAR-Net dissertation base: explicit victim and network-oriented repositioning"
sim-time-limit = 900s
repeat = 30
seed-set = ${repetition}
*.numDrones = 4
*.numTeams = 1
*.numVictims = 1

*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = 0m
*.physicalEnvironment.spaceMaxX = 1000m
*.physicalEnvironment.spaceMaxY = 1000m
*.physicalEnvironment.spaceMaxZ = 25m
*.physicalEnvironment.config = xmldoc("dissertation-obstacles.xml")
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

**.wlan[*].radio.opMode = "b"
**.wlan[*].radio.bandName = "2.4 GHz"
**.wlan[*].radio.transmitter.bitrate = 1Mbps
**.wlan[*].radio.transmitter.datarate = 1Mbps
**.drone[*].wlan[*].radio.transmitter.power = 20mW
**.team[*].wlan[*].radio.transmitter.power = 20mW

**.drone[*].mobility.typename = "echosar.mobility.BaGaussMarkovMobility"
**.drone[*].mobility.alpha = 0.75
**.drone[*].mobility.speed = 13mps
**.drone[*].mobility.speedStdDev = 0mps
**.drone[*].mobility.angleStdDev = 20deg
**.drone[*].mobility.margin = 20m
**.drone[*].mobility.updateInterval = 1s
**.drone[*].mobility.constraintAreaMinX = 0m
**.drone[*].mobility.constraintAreaMaxX = 1000m
**.drone[*].mobility.constraintAreaMinY = 0m
**.drone[*].mobility.constraintAreaMaxY = 1000m
**.drone[*].mobility.constraintAreaMinZ = 10m
**.drone[*].mobility.constraintAreaMaxZ = 20m
**.drone[0].mobility.initialX = 500m
**.drone[0].mobility.initialY = 500m
**.drone[0].mobility.initialZ = 10m
**.drone[1].mobility.initialX = 510m
**.drone[1].mobility.initialY = 520m
**.drone[1].mobility.initialZ = 10m
**.drone[2].mobility.initialX = 480m
**.drone[2].mobility.initialY = 520m
**.drone[2].mobility.initialZ = 12m
**.drone[3].mobility.initialX = 500m
**.drone[3].mobility.initialY = 540m
**.drone[3].mobility.initialZ = 12m

# INET 4.5.4 has no module named RandomWalkMobility. MassMobility is the
# closest native bounded random-walk model and is therefore used explicitly.
**.team[*].mobility.typename = "MassMobility"
**.team[*].mobility.changeInterval = 5s
**.team[*].mobility.angleDelta = normal(0deg, 30deg)
**.team[*].mobility.speed = 1.5mps
**.team[*].mobility.constraintAreaMinX = 0m
**.team[*].mobility.constraintAreaMaxX = 1000m
**.team[*].mobility.constraintAreaMinY = 0m
**.team[*].mobility.constraintAreaMaxY = 1000m
# MassMobility cannot reflect inside a zero-thickness Z interval. With zero
# elevation the team remains at 1.5 m; this small margin only avoids the
# boundary assertion and does not introduce vertical movement.
**.team[*].mobility.constraintAreaMinZ = 1.4m
**.team[*].mobility.constraintAreaMaxZ = 1.6m
**.team[0].mobility.initialX = 540m
**.team[0].mobility.initialY = 500m
**.team[0].mobility.initialZ = 1.5m
**.team[0].app[0].teamId = "team0"
**.team[*].app[0].positionUpdateInterval = 1s

**.victim[0].victimId = "victim0"
**.victim[0].positionX = 500m
**.victim[0].positionY = 500m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 2s
**.victim[1].victimId = "victim1"
**.victim[1].positionX = 520m
**.victim[1].positionY = 500m
**.victim[1].positionZ = 0m
**.victim[1].detectionTime = 4s

**.drone[*].app[0].retryInterval = 30s
**.drone[*].app[0].ackTimeout = 5s
**.drone[*].app[0].maxAttempts = 5
**.drone[*].app[0].alertTtl = 180s
**.drone[*].app[0].baEnabled = true
**.drone[*].app[0].maximumRepositionDistance = 25m
**.drone[*].app[0].minimumAltitude = 6m
**.drone[*].app[0].maximumAltitude = 20m
**.drone[*].app[0].flightTimeLimit = 900s

[Config Experiment_Control_BaOff]
extends = DissertationBase
description = "Paired control: obstacles and sensing active, BA disabled"
**.drone[*].app[0].baEnabled = false

[Config Experiment_Proposed_BaOn]
extends = DissertationBase
description = "Proposed scenario: obstacles, degradation sensing and BA enabled"

[Config Visual_Demo]
extends = DissertationBase
description = "Interactive mobile demonstration with UAV trails and delayed ACK for BA visualization"
repeat = 1
sim-time-limit = 120s
# O cenário científico inicia os nós perto do obstáculo em (530,500).
# Para inspeção no Qtenv, espalhe somente as posições iniciais; velocidades,
# área e modelos de mobilidade permanecem iguais aos do experimento.
**.drone[0].mobility.initialX = 250m
**.drone[0].mobility.initialY = 300m
**.drone[1].mobility.initialX = 400m
**.drone[1].mobility.initialY = 200m
**.drone[2].mobility.initialX = 600m
**.drone[2].mobility.initialY = 200m
**.drone[3].mobility.initialX = 750m
**.drone[3].mobility.initialY = 300m
**.team[0].mobility.initialX = 700m
**.team[0].mobility.initialY = 650m
**.team[0].app[0].ackStartTime = 30s
**.drone[*].app[0].rssiThreshold = -30dBm
**.wlan[*].radio.receiver.sensitivity = -120dBm
**.radioMedium.backgroundNoise.power = -140dBm
*.visualizer.mobilityVisualizer.displayMobility = true
*.visualizer.mobilityVisualizer.displayPositions = true
*.visualizer.mobilityVisualizer.displayVelocities = true
*.visualizer.mobilityVisualizer.velocityArrowScale = 4
*.visualizer.mobilityVisualizer.displayMovementTrails = true
*.visualizer.mobilityVisualizer.trailLength = 60
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.physicalLinkVisualizer.displayLinks = true

[Config Validation_Direct]
extends = DissertationBase
description = "Deterministic direct delivery without obstacle"
repeat = 1
sim-time-limit = 20s
*.numDrones = 1
*.physicalEnvironment.config = xml("<config/>")
*.radioMedium.obstacleLoss.typename = ""
**.drone[0].mobility.speed = 0mps
**.team[0].mobility.typename = "StationaryMobility"

[Config Validation_Obstacle_BaOff]
extends = DissertationBase
description = "Deterministic air-ground obstacle loss and retry validation"
repeat = 1
sim-time-limit = 160s
*.numDrones = 1
**.drone[0].mobility.speed = 0mps
**.team[0].mobility.typename = "StationaryMobility"
**.drone[0].app[0].baEnabled = false

[Config Validation_BaOn]
extends = Validation_Obstacle_BaOff
description = "Deterministic sensor and BA validation with fixed seed"
sim-time-limit = 70s
**.drone[0].app[0].baEnabled = true
**.drone[0].app[0].rssiThreshold = -30dBm
**.team[0].app[0].ackStartTime = 30s
**.wlan[*].radio.receiver.sensitivity = -120dBm
**.radioMedium.backgroundNoise.power = -140dBm

[Config Validation_Sensor_RejectRange]
extends = Validation_BaOn
description = "Deterministic rejection when obstacle is outside the configured visual range"
**.drone[0].obstacleSensor.maximumRange = 10m

[Config Validation_TwoVictims]
extends = Validation_Direct
description = "Deterministic assignment and acknowledgement of two independent victims"
sim-time-limit = 30s
*.numDrones = 2
*.numVictims = 2
**.drone[1].mobility.speed = 0mps

[Config Validation_Obstacle_Rssi]
extends = Validation_Obstacle_BaOff
description = "Controlled RSSI comparison with obstacle and extended receiver floor"
**.wlan[*].radio.receiver.sensitivity = -120dBm
**.radioMedium.backgroundNoise.power = -140dBm

[Config Validation_Clear_Rssi]
extends = Validation_Obstacle_Rssi
description = "Controlled unobstructed RSSI baseline with identical radio parameters"
*.physicalEnvironment.config = xml("<config/>")
*.radioMedium.obstacleLoss.typename = ""

[Config Validation_Multihop]
extends = DissertationBase
description = "Deterministic AODV multi-hop and unobstructed air-air geometry"
repeat = 1
sim-time-limit = 30s
*.numDrones = 2
**.drone[*].mobility.speed = 0mps
**.drone[0].mobility.initialX = 50m
**.drone[0].mobility.initialY = 500m
**.drone[0].mobility.initialZ = 10m
**.drone[1].mobility.initialX = 500m
**.drone[1].mobility.initialY = 500m
**.drone[1].mobility.initialZ = 10m
**.team[0].mobility.typename = "StationaryMobility"
**.team[0].mobility.initialX = 950m
**.team[0].mobility.initialY = 500m
**.team[0].mobility.initialZ = 1.5m
**.victim[0].positionX = 50m
**.victim[0].positionY = 500m
**.wlan[*].radio.receiver.sensitivity = -83dBm
