[General]
seed-set = ${repetition}
num-rngs = 25
# RNGs exclusivos mantêm as trajetórias pareadas quando numTeams muda.
**.drone[0].mobility.rng-0 = 1
**.drone[1].mobility.rng-0 = 2
**.drone[2].mobility.rng-0 = 3
**.drone[3].mobility.rng-0 = 4
**.team[0].mobility.rng-0 = 5
**.team[1].mobility.rng-0 = 6
**.team[2].mobility.rng-0 = 7
**.team[3].mobility.rng-0 = 8
**.team[4].mobility.rng-0 = 9
**.team[5].mobility.rng-0 = 10
**.team[6].mobility.rng-0 = 11
**.team[7].mobility.rng-0 = 12
**.team[8].mobility.rng-0 = 13
**.team[9].mobility.rng-0 = 14
**.team[10].mobility.rng-0 = 15
**.team[11].mobility.rng-0 = 16
**.team[12].mobility.rng-0 = 17
**.team[13].mobility.rng-0 = 18
**.team[14].mobility.rng-0 = 19
**.drone[0].app[0].rng-0 = 20
**.drone[1].app[0].rng-0 = 21
**.drone[2].app[0].rng-0 = 22
**.drone[3].app[0].rng-0 = 23
# Posições e detecções das vítimas não perturbam RNGs de mobilidade/rede.
**.victim[*].rng-0 = 24

output-scalar-file = results/omnetpp/${configname}-${runnumber}.sca
output-vector-file = results/omnetpp/${configname}-${runnumber}.vec
**.vector-recording = false
**.scalar-recording = true
**.mobility.initFromDisplayString = false
**.app[0].cmdenv-log-level = INFO
*.visualizer.sceneVisualizer.viewScale = "0.9 0.9"
*.visualizer.sceneVisualizer.viewTranslation = "50 50"

# Rede ad hoc: AODV descobre rotas; nenhuma rota estática é injetada.
*.configurator.config = xml("<config><interface hosts='*' address='10.0.0.x' netmask='255.255.255.0'/></config>")
*.configurator.addStaticRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.addDefaultRoutes = false
**.ip.limitedBroadcast = true
**.aodv.activeRouteTimeout = 5s

# IEEE 802.11b DSSS 1 Mbit/s. O FSPL deriva da distância e frequência;
# não é ajustado artificialmente ao tamanho da área.
**.radioMedium.typename = "Ieee80211ScalarRadioMedium"
**.radioMedium.pathLoss.typename = "FreeSpacePathLoss"
**.radioMedium.pathLoss.alpha = 2
**.radioMedium.backgroundNoise.typename = "IsotropicScalarBackgroundNoise"
**.radioMedium.backgroundNoise.power = -100dBm
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 2.4GHz
**.wlan[*].radio.bandwidth = 22MHz
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB
# Potência operacional escolhida no teste preliminar sem obstáculos
# (Calibration_NoObstacles, 5 seeds, BA desligado), com o critério de manter
# pelo menos 80% dos alertas entregues:
#
#   2,88 mW (300 m) -> 29,6%   5,12 mW (400 m) -> 50,4%
#   10 mW  (559 m) -> 80,8%   20 mW  (790 m) -> 99,2%
#
# 10 mW é a menor potência que atende o critério. Menor potência preserva mais
# falhas de enlace, que são a exposição do mecanismo avaliado; 20 mW entrega
# quase tudo e quase não produz gatilho. Com FreeSpacePathLoss a 2,4 GHz e
# sensibilidade de -85 dBm, 10 dBm correspondem a 559 m de alcance nominal.
# O ruído de fundo de -100 dBm deixa 15 dB de SNIR no limite, acima do
# snirThreshold, então quem determina o alcance é a sensibilidade.
**.wlan[*].radio.transmitter.power = 10mW
**.wlan[*].mac.typename = "Ieee80211Mac"
**.wlan[*].mgmt.typename = "Ieee80211MgmtAdhoc"
**.wlan[*].agent.typename = ""
**.wlan[*].mac.queue.packetCapacity = 50
**.wlan[*].opMode = "b"
**.wlan[*].bitrate = 1Mbps
**.wlan[*].radio.bandName = "2.4 GHz"

network = echosar.simulations.BasicNetwork

# Piso e teto operacional do espaço físico.
*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = 0m
*.physicalEnvironment.spaceMaxZ = 20m

# Mobilidade: tipo comandável pelo reposicionamento e envelope vertical.
**.drone[*].mobility.typename = "echosar.mobility.BaGaussMarkovMobility"
**.drone[*].mobility.updateInterval = 1s
**.drone[*].mobility.constraintAreaMinX = 0m
**.drone[*].mobility.constraintAreaMinY = 0m
**.drone[*].mobility.constraintAreaMinZ = 6m
**.drone[*].mobility.constraintAreaMaxZ = 20m
**.team[*].mobility.initialZ = 0m

# Aplicação: porta, difusão de estado e temporização de manutenção.
**.app[0].appPort = 5000
**.drone[*].app[0].droneStatusPayloadBytes = 160
**.drone[*].app[0].droneStatusInterval = 2s
**.drone[*].app[0].droneEntryLifetime = 6s
**.drone[*].app[0].communicationRange = 750m
**.drone[*].app[0].ackTimeout = 2s
# A entrada operacional da equipe expira em 30 s (definido no cenário), mas a
# última posição conhecida continua retida por 120 s para o mecanismo de
# recuperação.
**.drone[*].app[0].lastKnownTeamRetention = 120s
# Descoberta propagada pela FANET: cada drone repassa uma atualização no
# máximo uma vez, com jitter curto, até o limite de saltos.
**.drone[*].app[0].teamUpdateMaxHops = 3
**.drone[*].app[0].teamUpdateForwardJitter = 20ms
**.drone[*].app[0].maintenanceInterval = 0.1s
**.team[*].app[0].victimAckPayloadBytes = 128

# Envelope de voo e velocidades do reposicionamento (DJI Phantom 4 Pro V2.0).
**.drone[*].app[0].minimumAltitude = 6m
**.drone[*].app[0].maximumAltitude = 20m
**.drone[*].app[0].areaMinX = 0m
**.drone[*].app[0].areaMinY = 0m
**.drone[*].app[0].horizontalSpeed = 13mps
**.drone[*].app[0].climbSpeed = 5mps
**.drone[*].app[0].descentSpeed = 3mps

# Pesos da função de aptidão; a soma precisa ser 1 (validado em DroneApp).
**.drone[*].app[0].wLink = 0.60
**.drone[*].app[0].wObstacle = 0.25
**.drone[*].app[0].wMove = 0.15

# Constantes do Bat Algorithm que não dependem da escala do cenário.
**.drone[*].app[0].batFrequencyMin = 0
**.drone[*].app[0].batFrequencyMax = 2
**.drone[*].app[0].batInitialAmplitude = 0.9
**.drone[*].app[0].batInitialPulseRate = 0.5
**.drone[*].app[0].batAmplitudeDecay = 0.9
**.drone[*].app[0].batPulseGrowth = 0.9
**.drone[*].app[0].batLocalSearchScale = 0.1

# O mecanismo científico verifica a obstrução geométrica do segmento entre o
# drone e a última posição conhecida da equipe. Alcance máximo negativo remove
# o limite: os 30 m frontais do Phantom 4 Pro permanecem como referência de
# prevenção de colisões, não como limite para identificar um edifício que
# bloqueia o enlace.
**.drone[*].obstacleSensor.minimumRange = 0.7m
**.drone[*].obstacleSensor.maximumRange = -1m

include experiment.ini
include validation/smoke-tests.ini
