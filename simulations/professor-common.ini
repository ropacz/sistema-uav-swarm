[Config ProfessorScenarioCommon]
network = echosar.simulations.BasicNetwork
abstract = true
# Validação preliminar: metade do tempo e 3 seeds.
# Protocolo final do PDF: sim-time-limit=900s e repeat=30.
repeat = 3
sim-time-limit = 450s
*.numDrones = 4
*.numTeams = ${teams=1,5,10,15}

*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = 0m
*.physicalEnvironment.spaceMaxX = 1000m
*.physicalEnvironment.spaceMaxY = 1000m
*.physicalEnvironment.spaceMaxZ = 20m
*.physicalEnvironment.config = xmldoc("professor-scenario-obstacles.xml")
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# DJI Phantom 4 Pro V2.0: ensaio a 13 m/s; subida/descida em modo P a
# 5/3 m/s. O teto de 20 m é requisito experimental, não limite do produto.
**.drone[*].mobility.typename = "echosar.mobility.BaGaussMarkovMobility"
**.drone[*].mobility.alpha = 0.75
**.drone[*].mobility.speed = 13mps
**.drone[*].mobility.speedStdDev = 2mps
**.drone[*].mobility.angleStdDev = 15deg
**.drone[*].mobility.elevation = 0deg
**.drone[*].mobility.elevationStdDev = 5deg
**.drone[*].mobility.margin = 20m
**.drone[*].mobility.updateInterval = 1s
**.drone[*].mobility.constraintAreaMinX = 0m
**.drone[*].mobility.constraintAreaMaxX = 1000m
**.drone[*].mobility.constraintAreaMinY = 0m
**.drone[*].mobility.constraintAreaMaxY = 1000m
**.drone[*].mobility.constraintAreaMinZ = 6m
**.drone[*].mobility.constraintAreaMaxZ = 20m
**.drone[*].mobility.initialZ = 12m
**.drone[0].mobility.initialX = 150m
**.drone[0].mobility.initialY = 150m
**.drone[1].mobility.initialX = 850m
**.drone[1].mobility.initialY = 150m
**.drone[2].mobility.initialX = 150m
**.drone[2].mobility.initialY = 850m
**.drone[3].mobility.initialX = 850m
**.drone[3].mobility.initialY = 850m

# A professora chamou de Random Walk; por orientação posterior, a equipe
# usa a implementação RandomWaypointMobility disponível no INET 4.5.4.
**.team[*].mobility.typename = "RandomWaypointMobility"
**.team[*].mobility.constraintAreaMinX = 50m
**.team[*].mobility.constraintAreaMaxX = 950m
**.team[*].mobility.constraintAreaMinY = 50m
**.team[*].mobility.constraintAreaMaxY = 950m
**.team[*].mobility.constraintAreaMinZ = 0m
**.team[*].mobility.constraintAreaMaxZ = 0m
**.team[*].mobility.speed = uniform(1mps, 2mps)
**.team[*].mobility.waitTime = uniform(0s, 5s)
**.team[*].mobility.initialZ = 0m
**.team[*].app[0].positionUpdateInterval = 1s
**.team[*].app[0].initialJitter = 1s
**.team[0].mobility.initialX = 200m
**.team[0].mobility.initialY = 850m
**.team[1].mobility.initialX = 100m
**.team[1].mobility.initialY = 100m
**.team[2].mobility.initialX = 500m
**.team[2].mobility.initialY = 100m
**.team[3].mobility.initialX = 900m
**.team[3].mobility.initialY = 100m
**.team[4].mobility.initialX = 100m
**.team[4].mobility.initialY = 300m
**.team[5].mobility.initialX = 500m
**.team[5].mobility.initialY = 300m
**.team[6].mobility.initialX = 900m
**.team[6].mobility.initialY = 300m
**.team[7].mobility.initialX = 100m
**.team[7].mobility.initialY = 500m
**.team[8].mobility.initialX = 900m
**.team[8].mobility.initialY = 500m
**.team[9].mobility.initialX = 100m
**.team[9].mobility.initialY = 700m
**.team[10].mobility.initialX = 500m
**.team[10].mobility.initialY = 700m
**.team[11].mobility.initialX = 900m
**.team[11].mobility.initialY = 700m
**.team[12].mobility.initialX = 100m
**.team[12].mobility.initialY = 900m
**.team[13].mobility.initialX = 500m
**.team[13].mobility.initialY = 900m
**.team[14].mobility.initialX = 900m
**.team[14].mobility.initialY = 900m

**.app[0].appPort = 5000
**.drone[*].app[0].victimAlertPayloadBytes = 320
**.team[*].app[0].positionUpdatePayloadBytes = 160
**.team[*].app[0].victimAckPayloadBytes = 96
**.drone[*].app[0].retryInterval = 10s
**.drone[*].app[0].ackTimeout = 2s
**.drone[*].app[0].maxAttempts = 8
**.drone[*].app[0].alertTtl = 100s
**.drone[*].app[0].linkWindow = 10s
**.drone[*].app[0].teamSilenceTimeout = 3s
**.drone[*].app[0].teamPredictionHorizon = 15s
**.drone[*].app[0].maximumTeamPredictionSpeed = 5mps
**.drone[*].app[0].maintenanceInterval = 0.1s
**.drone[*].app[0].pdrThreshold = 0.8
**.drone[*].app[0].rssiThreshold = -80dBm

# BA busca posição segura; o drone se desloca sem teletransporte e aguarda ACK.
**.drone[*].app[0].maxBaCycles = 2
**.drone[*].app[0].maximumRepositionDistance = 120m
**.drone[*].app[0].minimumAltitude = 6m
**.drone[*].app[0].maximumAltitude = 20m
**.drone[*].app[0].areaMinX = 0m
**.drone[*].app[0].areaMaxX = 1000m
**.drone[*].app[0].areaMinY = 0m
**.drone[*].app[0].areaMaxY = 1000m
**.drone[*].app[0].horizontalSpeed = 13mps
**.drone[*].app[0].climbSpeed = 5mps
**.drone[*].app[0].descentSpeed = 3mps
**.drone[*].app[0].flightTimeLimit = 900s
**.drone[*].app[0].wLink = 0.60
**.drone[*].app[0].wObstacle = 0.25
**.drone[*].app[0].wMove = 0.15
**.drone[*].app[0].obstacleSigma = 20m
**.drone[*].app[0].obstacleSafetyMargin = 2m
**.drone[*].app[0].linkNormalizationDistance = 1000m
**.drone[*].app[0].batPopulation = 20
**.drone[*].app[0].batIterations = 50
**.drone[*].app[0].batInitializationAttempts = 100
**.drone[*].app[0].batFrequencyMin = 0
**.drone[*].app[0].batFrequencyMax = 2
**.drone[*].app[0].batInitialAmplitude = 0.9
**.drone[*].app[0].batInitialPulseRate = 0.5
**.drone[*].app[0].batAmplitudeDecay = 0.9
**.drone[*].app[0].batPulseGrowth = 0.9
**.drone[*].app[0].batLocalSearchScale = 0.1

# Faixa frontal oficial do sensor visual do Phantom 4 Pro: 0,7--30 m.
**.drone[*].obstacleSensor.minimumRange = 0.7m
**.drone[*].obstacleSensor.maximumRange = 30m

# PCAPNG é habilitado sob demanda por ./run.sh --pcap.
*.drone[*].numPcapRecorders = 0
*.team[*].numPcapRecorders = 0
*.drone[*].pcapRecorder[*].fileFormat = "pcapng"
*.team[*].pcapRecorder[*].fileFormat = "pcapng"
*.drone[*].pcapRecorder[*].snaplen = 65535
*.team[*].pcapRecorder[*].snaplen = 65535
*.drone[*].pcapRecorder[*].dumpBadFrames = true
*.team[*].pcapRecorder[*].dumpBadFrames = true
*.drone[*].pcapRecorder[*].alwaysFlush = true
*.team[*].pcapRecorder[*].alwaysFlush = true
**.ipv4.**.crcMode = "computed"
**.udp.crcMode = "disabled"
**.fcsMode = "computed"

[Config ProfessorBaOff]
extends = ProfessorScenarioCommon
abstract = true
**.drone[*].app[0].baEnabled = false
**.drone[*].app[0].applicationIpTtl = 1
**.team[*].app[0].applicationIpTtl = 1

[Config ProfessorBaOn]
extends = ProfessorScenarioCommon
abstract = true
**.drone[*].app[0].baEnabled = true
**.drone[*].app[0].applicationIpTtl = 1
**.team[*].app[0].applicationIpTtl = 1

[Config ProfessorMultihop]
extends = ProfessorScenarioCommon
abstract = true
**.drone[*].app[0].baEnabled = false
**.drone[*].app[0].applicationIpTtl = 32
**.team[*].app[0].applicationIpTtl = 32
