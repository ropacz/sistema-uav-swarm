# Base sem variável iterativa: pode ser reutilizada pelo experimento principal
# sem criar combinações invisíveis de numTeams.
[Config Scenario1OneVictimBase]
extends = ProfessorBaOff
abstract = true
*.numVictims = 1
**.victim[0].victimId = "victim0"
**.victim[0].positionX = 100m
**.victim[0].positionY = 900m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 160s
**.victim[0].assignedDroneIndex = 2

# Robustez do cenário 1A: varia somente aqui a quantidade de equipes.
[Config Scenario1_OneVictim_BaOff]
extends = Scenario1OneVictimBase
description = "Scenario 1A control: one victim, direct link, BA off"
*.numTeams = ${teams=1,5,10,15}

[Config Scenario1_OneVictim_BaOn]
extends = Scenario1_OneVictim_BaOff, ProfessorBaOn
description = "Scenario 1A treatment: one victim, direct link, BA on"
