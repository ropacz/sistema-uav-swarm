# Validação determinística da descoberta temporária. Não é cenário científico.
[Config DiscoveryValidation_Direct]
extends = ProfessorMultihop
description = "Controlled direct path: hopCount must be 0 intermediate routers"
repeat = 1
sim-time-limit = 60s
*.numDrones = 1
*.numTeams = 1
*.numVictims = 1

**.drone[*].mobility.speed = 0mps
**.drone[*].mobility.speedStdDev = 0mps
**.drone[*].mobility.angleStdDev = 0deg
**.drone[*].mobility.elevationStdDev = 0deg
**.drone[0].mobility.initialX = 50m
**.drone[0].mobility.initialY = 50m
**.drone[0].mobility.initialZ = 12m

**.team[0].mobility.typename = "StationaryMobility"
**.team[0].mobility.initialX = 300m
**.team[0].mobility.initialY = 50m
**.team[0].mobility.initialZ = 0m
**.team[0].app[0].initialJitter = 0s
**.team[0].app[0].teamId = "t"

**.victim[0].victimId = "v"
**.victim[0].positionX = 50m
**.victim[0].positionY = 50m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 20s
**.victim[0].assignedDroneIndex = 0

[Config DiscoveryValidation_RemoteViaRelay]
extends = DiscoveryValidation_Direct
description = "Discovery boundary: remote team broadcast does not cross the relay"
*.numDrones = 2
**.drone[1].mobility.initialX = 500m
**.drone[1].mobility.initialY = 50m
**.drone[1].mobility.initialZ = 12m
**.team[0].mobility.initialX = 950m
