# Cenário 1B: 4 drones, 2 vítimas, 2 obstáculos e 1/5/10/15 equipes.
# Índices distintos garantem os dois drones solicitantes exigidos pelo PDF.
[Config Scenario1_TwoVictims_BaOff]
extends = ProfessorBaOff
description = "Scenario 1B control: two victims, direct link, BA off"
*.numVictims = 2
**.victim[0].victimId = "victim0"
**.victim[0].positionX = 100m
**.victim[0].positionY = 900m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 160s
**.victim[0].assignedDroneIndex = 2
**.victim[1].victimId = "victim1"
**.victim[1].positionX = 900m
**.victim[1].positionY = 300m
**.victim[1].positionZ = 0m
**.victim[1].detectionTime = 260s
**.victim[1].assignedDroneIndex = 1

[Config Scenario1_TwoVictims_BaOn]
extends = Scenario1_TwoVictims_BaOff, ProfessorBaOn
description = "Scenario 1B treatment: two victims, direct link, BA on"

[Config Scenario1_TwoVictims_Multihop]
extends = Scenario1_TwoVictims_BaOff, ProfessorMultihop
description = "Scenario 1B reference: two victims, multihop, BA off"
