# Teste determinístico de integração do mecanismo do BA.
# NÃO é cenário científico: IdealObstacleLoss cria bloqueio binário proposital.
[Config BA_SmokeTest]
network = echosar.simulations.BasicNetwork
description = "Smoke test: ACK suppression triggers sensor, BA movement, and immediate retry"
repeat = 1
sim-time-limit = 70s
*.numDrones = 1
*.numTeams = 1
*.numVictims = 1

*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = 0m
*.physicalEnvironment.spaceMaxX = 250m
*.physicalEnvironment.spaceMaxY = 200m
*.physicalEnvironment.spaceMaxZ = 20m
*.physicalEnvironment.config = xmldoc("ba-smoke-test-obstacle.xml")
# O smoke separa mecanismos: o obstáculo alimenta sensor/fitness, enquanto a
# janela de ACK abaixo injeta a falha de aplicação de forma determinística.
*.radioMedium.obstacleLoss.typename = ""

# Drone parado até o BA comandar um deslocamento físico.
**.drone[0].mobility.typename = "echosar.mobility.BaGaussMarkovMobility"
**.drone[0].mobility.alpha = 1
**.drone[0].mobility.speed = 0mps
**.drone[0].mobility.speedStdDev = 0mps
**.drone[0].mobility.angleStdDev = 0deg
**.drone[0].mobility.elevationStdDev = 0deg
**.drone[0].mobility.margin = 5m
**.drone[0].mobility.updateInterval = 1s
**.drone[0].mobility.constraintAreaMinX = 0m
**.drone[0].mobility.constraintAreaMaxX = 250m
**.drone[0].mobility.constraintAreaMinY = 0m
**.drone[0].mobility.constraintAreaMaxY = 200m
**.drone[0].mobility.constraintAreaMinZ = 6m
**.drone[0].mobility.constraintAreaMaxZ = 20m
**.drone[0].mobility.initialX = 100m
**.drone[0].mobility.initialY = 100m
**.drone[0].mobility.initialZ = 10m

# A equipe começa visível, cruza a parede em t=23 s e continua atrás dela.
**.team[0].mobility.typename = "TurtleMobility"
**.team[0].mobility.initialZ = 0m
**.team[0].mobility.turtleScript = xmldoc("ba-smoke-test-team.xml")
**.team[0].app[0].teamId = "team0"
**.team[0].app[0].positionUpdateInterval = 0.5s
**.team[0].app[0].initialJitter = 0s
**.team[0].app[0].ackStartTime = 30s

# A vítima é detectada cinco segundos após a equipe começar a ficar obstruída.
**.victim[0].victimId = "smoke-victim"
**.victim[0].positionX = 133m
**.victim[0].positionY = 100m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 28s
**.victim[0].assignedDroneIndex = 0

**.app[0].appPort = 5000
**.drone[0].app[0].baEnabled = true
**.drone[0].app[0].applicationIpTtl = 1
**.team[0].app[0].applicationIpTtl = 1
**.drone[0].app[0].ackTimeout = 2s
**.drone[0].app[0].retryInterval = 10s
**.drone[0].app[0].maxAttempts = 5
**.drone[0].app[0].repositionAfterUnackedAttempts = 1
**.drone[0].app[0].alertTtl = 40s
**.drone[0].app[0].teamEntryLifetime = 15s
**.drone[0].app[0].maintenanceInterval = 0.1s
**.drone[0].app[0].maximumRepositionDistance = 50m
**.drone[0].app[0].minimumAltitude = 6m
**.drone[0].app[0].maximumAltitude = 20m
**.drone[0].app[0].areaMinX = 0m
**.drone[0].app[0].areaMaxX = 250m
**.drone[0].app[0].areaMinY = 0m
**.drone[0].app[0].areaMaxY = 200m
**.drone[0].app[0].horizontalSpeed = 13mps
**.drone[0].app[0].climbSpeed = 5mps
**.drone[0].app[0].descentSpeed = 3mps
**.drone[0].app[0].flightTimeLimit = 70s
**.drone[0].app[0].wLink = 0.60
**.drone[0].app[0].wObstacle = 0.25
**.drone[0].app[0].wMove = 0.15
**.drone[0].app[0].obstacleSigma = 10m
**.drone[0].app[0].obstacleSafetyMargin = 1m
**.drone[0].app[0].linkNormalizationDistance = 250m
**.drone[0].app[0].batPopulation = 40
**.drone[0].app[0].batIterations = 100
**.drone[0].app[0].batInitializationAttempts = 200
**.drone[0].app[0].batFrequencyMin = 0
**.drone[0].app[0].batFrequencyMax = 2
**.drone[0].app[0].batInitialAmplitude = 0.9
**.drone[0].app[0].batInitialPulseRate = 0.5
**.drone[0].app[0].batAmplitudeDecay = 0.9
**.drone[0].app[0].batPulseGrowth = 0.9
**.drone[0].app[0].batLocalSearchScale = 0.1
**.drone[0].obstacleSensor.minimumRange = 0.7m
**.drone[0].obstacleSensor.maximumRange = 30m

*.drone[0].numPcapRecorders = 0
*.team[0].numPcapRecorders = 0
*.drone[0].pcapRecorder[*].fileFormat = "pcapng"
*.team[0].pcapRecorder[*].fileFormat = "pcapng"
