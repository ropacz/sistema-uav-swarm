# Teste determinístico de integração do mecanismo do BA.
# NÃO é cenário científico: IdealObstacleLoss cria bloqueio binário proposital.
[Config BA_SmokeTest]
description = "Smoke test: ACK suppression triggers sensor, BA movement, and immediate retry"
repeat = 1
sim-time-limit = 70s
*.numDrones = 1
*.numTeams = 1
*.numVictims = 1

*.physicalEnvironment.spaceMaxX = 250m
*.physicalEnvironment.spaceMaxY = 200m
*.physicalEnvironment.config = xmldoc("ba-smoke-test-obstacle.xml")
# O smoke separa mecanismos: o obstáculo alimenta sensor/fitness, enquanto a
# janela de ACK abaixo injeta a falha de aplicação de forma determinística.
*.radioMedium.obstacleLoss.typename = ""
# Os smoke tests fixam a própria potência: a geometria determinística deles
# (em especial o relay de 500 m do Multihop) não deve depender da calibração
# de alcance do cenário científico, que vive em [General].
**.wlan[*].radio.transmitter.power = 20mW
# Os smoke tests validam o sensor como faixa limitada (diretriz 28.4), então
# fixam os próprios limites em vez de herdar o cenário científico.
**.drone[*].obstacleSensor.minimumRange = 0.7m
**.drone[*].obstacleSensor.maximumRange = 30m

# Drone parado até o BA comandar um deslocamento físico.
**.drone[0].mobility.alpha = 1
**.drone[0].mobility.speed = 0mps
**.drone[0].mobility.speedStdDev = 0mps
**.drone[0].mobility.angleStdDev = 0deg
**.drone[0].mobility.elevationStdDev = 0deg
**.drone[0].mobility.margin = 5m
**.drone[0].mobility.constraintAreaMaxX = 250m
**.drone[0].mobility.constraintAreaMaxY = 200m
**.drone[0].mobility.initialX = 100m
**.drone[0].mobility.initialY = 100m
**.drone[0].mobility.initialZ = 10m

# A equipe começa visível, cruza a parede em t=23 s e continua atrás dela.
**.team[0].mobility.typename = "TurtleMobility"
**.team[0].mobility.turtleScript = xmldoc("ba-smoke-test-team.xml")
**.team[0].app[0].teamId = "team0"
**.team[0].app[0].teamUpdateInterval = 0.5s
**.team[0].app[0].initialJitter = 0s
**.team[0].app[0].ackStartTime = 30s

# A vítima é detectada cinco segundos após a equipe começar a ficar obstruída.
**.victim[0].victimId = "smoke-victim"
**.victim[0].positionX = 133m
**.victim[0].positionY = 100m
**.victim[0].positionZ = 0m
**.victim[0].detectionTime = 28s
**.victim[0].assignedDroneIndex = 0

**.drone[0].app[0].droneId = "drone0"
**.drone[0].app[0].baEnabled = true
**.drone[0].app[0].droneStatusInitialOffset = 0.2s
**.drone[0].app[0].applicationIpTtl = 1
**.team[0].app[0].applicationIpTtl = 1
**.drone[*].app[0].retryInterval = 10s
**.drone[*].app[0].maxAttempts = 5
**.drone[*].app[0].repositionAfterUnackedAttempts = 1
**.drone[*].app[0].alertTtl = 40s
**.drone[*].app[0].alertInterval = 50s
**.drone[*].app[0].teamEntryLifetime = 15s
**.drone[0].app[0].maximumRepositionDistance = 50m
**.drone[0].app[0].areaMaxX = 250m
**.drone[0].app[0].areaMaxY = 200m
**.drone[0].app[0].flightTimeLimit = 70s
**.drone[0].app[0].obstacleSigma = 10m
**.drone[0].app[0].obstacleSafetyMargin = 1m
**.drone[0].app[0].linkNormalizationDistance = 250m
**.drone[0].app[0].batPopulation = 40
**.drone[0].app[0].batIterations = 100
**.drone[0].app[0].batInitializationAttempts = 200

# Encerra durante o movimento para provar que custo parcial não é contabilizado
# como reposicionamento concluído.
[Config RepositionInterrupted_SmokeTest]
extends = BA_SmokeTest
description = "Smoke test: unfinished movement is excluded from completed costs"
sim-time-limit = 31s

# Par determinístico para isolar o efeito de propagação do mesmo obstáculo.
[Config ObstacleClear_SmokeTest]
extends = BA_SmokeTest
description = "Smoke test control: packet crosses the same geometry without obstacle loss"
sim-time-limit = 35s
**.team[0].app[0].ackStartTime = 0s
**.drone[0].app[0].baEnabled = false
**.drone[0].app[0].retryInterval = 2s
**.drone[0].app[0].maxAttempts = 2
**.drone[0].app[0].alertTtl = 10s
**.drone[0].app[0].alertInterval = 60s
**.wlan[*].radio.transmitter.power = 0.1mW

[Config ObstacleBlocked_SmokeTest]
extends = ObstacleClear_SmokeTest
description = "Smoke test treatment: concrete obstacle attenuates the packet"
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"

# O obstáculo fica fora do alcance do sensor: a detecção é rejeitada, mas o BA
# é acionado assim mesmo, porque o gatilho é a degradação da rede e não a
# câmera. Ver docs/desvios_e_extensoes.md, D4/E4.
[Config SensorOutOfRange_SmokeTest]
extends = BA_SmokeTest
description = "Smoke test: out-of-range obstacle is not detected, BA still runs"
sim-time-limit = 31s
**.drone[0].obstacleSensor.maximumRange = 20m

# Teste complementar: o drone 0 inicia conectado ao drone 1 e o BA deve
# escolher uma posição ainda dentro do alcance geométrico anunciado.
[Config Connectivity_SmokeTest]
extends = BA_SmokeTest
description = "Smoke test: BA preserves one previously known drone neighbor"
*.numDrones = 2
**.drone[*].app[0].communicationRange = 50m

**.drone[1].mobility.alpha = 1
**.drone[1].mobility.speed = 0mps
**.drone[1].mobility.speedStdDev = 0mps
**.drone[1].mobility.angleStdDev = 0deg
**.drone[1].mobility.elevationStdDev = 0deg
**.drone[1].mobility.margin = 5m
**.drone[1].mobility.constraintAreaMaxX = 250m
**.drone[1].mobility.constraintAreaMaxY = 200m
**.drone[1].mobility.initialX = 100m
**.drone[1].mobility.initialY = 60m
**.drone[1].mobility.initialZ = 10m
**.drone[1].app[0].droneId = "drone1"
**.drone[1].app[0].droneStatusInitialOffset = 0.4s

# Verifica que a vítima permanece ativa após cada ACK e produz um novo
# alerta lógico sem sobrepor o anterior.
[Config AlertLifecycle_SmokeTest]
extends = BA_SmokeTest
description = "Smoke test: active victim produces sequential periodic alerts"
**.victim[0].detectionTime = 5s
**.team[0].app[0].ackStartTime = 0s
**.drone[0].app[0].baEnabled = false
**.drone[0].app[0].ackTimeout = 0.5s
**.drone[0].app[0].retryInterval = 1s
**.drone[0].app[0].maxAttempts = 2
**.drone[0].app[0].repositionAfterUnackedAttempts = 1
**.drone[0].app[0].alertTtl = 5s
**.drone[0].app[0].alertInterval = 10s

# A equipe é descoberta enquanto ainda está ao alcance direto e depois se
# afasta gradualmente. O alerta usa o drone 1 como relay AODV.
[Config Multihop_SmokeTest]
extends = Connectivity_SmokeTest
description = "Smoke test: VictimAlert is delivered through one drone relay"
sim-time-limit = 30s
*.physicalEnvironment.spaceMaxX = 1200m
**.drone[*].mobility.constraintAreaMaxX = 1200m
**.drone[0].mobility.initialX = 50m
**.drone[0].mobility.initialY = 100m
**.drone[1].mobility.initialX = 550m
**.drone[1].mobility.initialY = 100m
**.team[0].mobility.turtleScript = xmldoc("multihop-smoke-test-team.xml")
**.team[0].app[0].ackStartTime = 0s
**.victim[0].positionX = 50m
**.victim[0].positionY = 100m
**.victim[0].detectionTime = 6s
**.app[0].applicationIpTtl = 32
**.drone[0].app[0].baEnabled = false
**.drone[*].app[0].alertInterval = 60s

# Sem equipes, cada oportunidade de envio deve produzir uma falha operacional
# auditável, sem inventar uma tentativa transmitida.
[Config NoKnownTeam_SmokeTest]
extends = BA_SmokeTest
description = "Smoke test: missing known team is recorded as operational failure"
sim-time-limit = 20s
*.numTeams = 0
**.victim[0].detectionTime = 5s
**.drone[0].app[0].baEnabled = false
**.drone[0].app[0].ackTimeout = 0.5s
**.drone[0].app[0].retryInterval = 1s
**.drone[0].app[0].maxAttempts = 2
**.drone[0].app[0].repositionAfterUnackedAttempts = 1
**.drone[0].app[0].alertTtl = 5s
**.drone[0].app[0].alertInterval = 10s

# Indicação de possível obstrução (S_ij). Geometria estática e enlace limpo:
# drone e equipe a 100 m um do outro, ambos a 10 m de altitude, com FSPL puro e
# nenhum obstáculo. A 10 mW o RSSI esperado é -30,05 - 20 log10(100) =
# -70,05 dBm, de modo que a atenuação excedente deve ficar em torno de zero e
# S_ij permanecer falso. Nenhuma vítima é criada: o teste mede a indicação, que
# é independente do ciclo de alertas.
[Config ObstructionClear_SmokeTest]
extends = BA_SmokeTest
description = "Smoke test: clear link keeps excess attenuation near zero"
sim-time-limit = 30s
*.numVictims = 0
*.physicalEnvironment.config = xml("<config/>")
*.radioMedium.obstacleLoss.typename = ""
# A referência de -30,05 dBm vale para 10 mW. A potência é fixada aqui em vez
# de herdada porque é ela que torna o valor analítico verificável.
**.wlan[*].radio.transmitter.power = 10mW
**.drone[0].mobility.initialX = 100m
**.drone[0].mobility.initialY = 100m
**.drone[0].mobility.initialZ = 10m
**.team[0].mobility.typename = "StationaryMobility"
**.team[0].mobility.initialX = 200m
**.team[0].mobility.initialY = 100m
**.team[0].mobility.initialZ = 10m
**.team[0].app[0].ackStartTime = 0s
**.drone[0].app[0].baEnabled = false

# Mesmo enlace com o limiar reduzido a 0,5 dB. Nenhuma indicação aqui significa
# que a referência implementada reproduz o canal do simulador dentro dessa
# margem: é a verificação numérica da atenuação excedente.
[Config ObstructionSensitive_SmokeTest]
extends = ObstructionClear_SmokeTest
description = "Smoke test: excess attenuation of a clear link stays below 0.5 dB"
**.drone[0].app[0].excessLossThresholdDb = 0.5

# Mesma geometria com a potência reduzida de 10 mW para 1 mW e a referência
# mantida em -30,05 dBm. A degradação é exatamente 10 dB em toda amostra, sem
# depender das propriedades dielétricas de nenhum material: é o ramo da
# atenuação excedente sendo verificado contra um valor fechado. A -80,05 dBm o
# enlace continua acima da sensibilidade de -85 dBm, então as recepções
# diretas prosseguem e a indicação não vem da ausência delas.
[Config ObstructionDegraded_SmokeTest]
extends = ObstructionClear_SmokeTest
description = "Smoke test: a 10 dB excess attenuation raises the indication"
**.wlan[*].radio.transmitter.power = 1mW

# Ramo da ausência de recepções diretas. A equipe é ouvida por 10 s a 100 m e
# então se afasta para 900 m, muito além do alcance nominal a 10 mW. As
# recepções diretas cessam por distância, e não por atenuação de material: o
# prazo de 3 s vence e a indicação sobe sem passar pelo ramo da atenuação.
[Config ObstructionSilent_SmokeTest]
extends = ObstructionClear_SmokeTest
description = "Smoke test: losing the direct link raises the indication by timeout"
sim-time-limit = 40s
*.physicalEnvironment.spaceMaxX = 1100m
**.team[0].mobility.typename = "TurtleMobility"
**.team[0].mobility.turtleScript = xmldoc("obstruction-smoke-test-team.xml")
**.team[0].mobility.constraintAreaMaxX = 1100m
