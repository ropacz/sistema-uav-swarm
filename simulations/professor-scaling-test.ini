# Sonda 2x2 da hipótese de escala: vítimas 1/40 x obstáculos 1/20.
# Mantém 4 drones, 5 equipes, rádio, mobilidade e seeds constantes.
[Config ProfessorScalingBase]
extends = ProfessorBaOff
abstract = true
repeat = 3
sim-time-limit = 450s
# O iterador teams é herdado do cenário comum. O alvo Makefile seleciona apenas
# seus runs teams=5; este valor literal garante a topologia pretendida.
*.numTeams = 5
*.numVictims = ${victims=1,40}
# Todas as detecções cabem na janela e deixam 100 s para retries/expiração.
**.victim[*].positionX = uniform(50m, 950m)
**.victim[*].positionY = uniform(50m, 950m)
**.victim[*].positionZ = 0m
**.victim[*].detectionTime = uniform(30s, 300s)
**.victim[*].assignedDroneIndex = -1

[Config ProfessorScaling_Obs01]
extends = ProfessorScalingBase
description = "Scaling probe: 1/40 victims with one concrete barrier"
*.physicalEnvironment.config = xmldoc("professor-scaling-obstacles-01.xml")

[Config ProfessorScaling_Obs20]
extends = ProfessorScalingBase
description = "Scaling probe: 1/40 victims with twenty concrete barriers"
*.physicalEnvironment.config = xmldoc("professor-scaling-obstacles-20.xml")

[Config ProfessorScaling_Obs20_BaOn]
extends = ProfessorScaling_Obs20
description = "Paired BA treatment for the 40-victim/20-obstacle stress cell"
**.drone[*].app[0].baEnabled = true
