# Experimento confirmatório mínimo: uma vítima, comunicação direta e uma
# quantidade fixa de equipes. Todos os parâmetros comuns são herdados do cenário
# físico; entre os dois braços muda exclusivamente baEnabled.
[Config MainExperimentBase]
extends = Scenario1OneVictimBase
abstract = true
repeat = 30
sim-time-limit = 900s
# Uma equipe elimina a seleção de destino como fator de confusão. A variação da
# quantidade de equipes pertence exclusivamente ao experimento de robustez.
*.numTeams = 1

[Config MainExperiment_BaOff]
extends = MainExperimentBase
description = "Primary paired control: direct communication, BA disabled"

[Config MainExperiment_BaOn]
extends = MainExperimentBase
description = "Primary paired treatment: direct communication, BA enabled"
**.drone[*].app[0].baEnabled = true
